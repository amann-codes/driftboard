server {
  listen 80;
  root /usr/share/nginx/html;

  # HTML must always come from the server, or a rebuild is invisible to clients.
  location = / { add_header Cache-Control "no-cache"; }
  location = /board/ { add_header Cache-Control "no-cache"; }
  location = /invite/ { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # The service worker must never be cached, or clients get stuck on an old version.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
